  var L=mailLetter(it);
  var h='<div class="bgd" id="bgd"></div><aside class="dr"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>'+esc(it.name)+'</h2>'+(it.website?'<a href="'+esc(it.website)+'" target="_blank" rel="noopener">сайт ↗</a>':"")+'</div><button class="btn sm" id="cl">Закрыть</button></div>';
  [["Чем занимаются / что делают",it.summary],["Почему нам подходят",it.why],["Что можем предложить",it.give],["Что уточнить",it.ask],["Минимальный заказ",it.minq]].forEach(function(p){if(p[1])h+='<div class="box"><b>'+p[0]+'</b>'+esc(p[1])+'</div>'});
  var info=[it.email&&"Почта: "+it.email,it.phone&&"Телефон: "+it.phone,it.contact&&"Контакт: "+it.contact,(it.city||it.country)&&[it.city,it.country].filter(Boolean).join(", ")].filter(Boolean);
  if(info.length)h+='<div class="box">'+info.map(esc).join("<br>")+'</div>';
  h+='<div class="fl"><label>Статус<select id="f_status">'+def.map(function(x){return'<option'+(x[0]===s.status?" selected":"")+'>'+esc(x[0])+'</option>'}).join("")+'</select></label>'+
  '<label>Кто отвечает<select id="f_owner">'+OWN.map(function(o){return'<option'+(o===s.owner?" selected":"")+'>'+o+'</option>'}).join("")+'</select></label>'+
  '<label class="f">Следующий шаг<input id="f_next" value="'+esc(s.next)+'"></label><label>Когда вернуться<input type="date" id="f_date" value="'+esc(s.nextdate)+'"></label>'+
  '<label class="f">Заметки<textarea id="f_notes" rows="3">'+esc(s.notes)+'</textarea></label></div>';
  if(L){
    h+='<h3>Письмо</h3>'+(S.me.name?'':'<div class="note">Чтобы в подписи было ваше имя, впишите его во вкладке «Настройки и копия».</div>')+'<div class="row"><button class="btn pri" id="mail">Открыть письмо в почте</button><button class="btn" id="copy">Скопировать</button>'+(L.ru?'<button class="btn" id="tr">Перевод</button>':"")+'</div><div id="ask"></div><div class="letter"><b>'+esc(L.subject)+'</b>\n\n'+esc(L.body)+'</div><div id="ru" style="display:none" class="letter">'+esc(L.ru)+'</div>';
  }
  h+='<h3>Что произошло</h3><div class="row"><select id="a_type"><option>Письмо отправлено</option><option>Получен ответ</option><option>Звонок</option><option selected>Заметка</option><option>Задача</option></select></div><textarea id="a_text" rows="2" placeholder="Например: ответили, что от 10 штук, 40 крон за штуку"></textarea><div class="row"><button class="btn pri" id="a_add">Записать</button></div><ul class="lg" id="lg"></ul>';
  if(it.kind==="order")h+='<div class="row"><button class="btn red sm" id="del">Удалить заказ</button></div>';
  h+='</aside>';
  $("layer").innerHTML=h;
  function close(){$("layer").innerHTML="";render()}
  $("bgd").onclick=close;$("cl").onclick=close;
  $("f_status").onchange=function(){setSt(it,{status:this.value});drawLog()};
  $("f_owner").onchange=function(){setSt(it,{owner:this.value})};
  $("f_next").onchange=function(){setSt(it,{next:this.value})};
  $("f_date").onchange=function(){setSt(it,{nextdate:this.value})};
  $("f_notes").onchange=function(){setSt(it,{notes:this.value})};
  function drawLog(){
    var l=S.log.filter(function(x){return x.id===it.id});
    $("lg").innerHTML=l.length?l.map(function(x){return'<li><div class="h">'+fmt(x.t)+(x.who?" · "+esc(x.who):"")+'</div><b>'+esc(x.type)+'</b>'+(x.text?": "+esc(x.text):"")+'</li>'}).join(""):'<li style="border:0;color:#6b7280">Пока ничего.</li>';
  }
  drawLog();
  $("a_add").onclick=function(){var t=$("a_text").value.trim();if(!t)return;var ty=$("a_type").value;addLog(it,ty,t);
    if(ty==="Письмо отправлено"&&st(it).status===def[0][0])setSt(it,{status:def[1][0]});
    if(ty==="Получен ответ"&&(st(it).status===def[0][0]||st(it).status===def[1][0]))setSt(it,{status:def[2][0]});
    $("a_text").value="";drawLog();openItKeep(it.id)};
  if(L){
    $("mail").onclick=function(){
      location.href="mailto:"+L.to+"?subject="+encodeURIComponent(L.subject)+"&body="+encodeURIComponent(L.body.replace(/\n/g,"\r\n"));
      $("ask").innerHTML='<div class="ask"><span>Отправили это письмо?</span><button class="btn sm pri" id="yes">Да, записать</button><button class="btn sm" id="no">Нет</button></div>';
      $("yes").onclick=function(){addLog(it,"Письмо отправлено","Тема: "+L.subject);if(st(it).status===def[0][0])setSt(it,{status:def[1][0]});toast("Записано");openItKeep(it.id)};
      $("no").onclick=function(){$("ask").innerHTML=""};
    };
    $("copy").onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(L.subject+"\n\n"+L.body):Promise.reject()).then(function(){toast("Скопировано")},function(){toast("Не получилось скопировать")})};
    if(L.ru)$("tr").onclick=function(){var r=$("ru");r.style.display=r.style.display==="none"?"block":"none"};
  }
  if(it.kind==="order")$("del").onclick=function(){if(confirm("Удалить заказ?")){S.orders=S.orders.filter(function(o){return o.id!==it.id});save();close()}};
}
function openItKeep(id){var y=document.querySelector(".dr").scrollTop;openIt(id);document.querySelector(".dr").scrollTop=y;tabs()}

function newOrder(){
  var opt=function(k){return'<option value="">не выбран</option>'+D[k].map(function(c){return'<option>'+esc(c.name)+'</option>'}).join("")};
  $("layer").innerHTML='<div class="bgd" id="bgd"></div><aside class="dr"><h2>Новый заказ</h2><div class="fl"><label class="f">Название<input id="n_name" placeholder="Например: втулка для GNL"></label><label>Клиент<select id="n_cl">'+opt("client")+'</select></label><label>Исполнитель<select id="n_ex">'+opt("executor")+'</select></label><label>Количество<input id="n_qty"></label><label>Деньги (заметка)<input id="n_money"></label><label class="f">Описание<textarea id="n_sum" rows="3"></textarea></label></div><div class="row"><button class="btn pri" id="n_ok">Создать</button><button class="btn" id="n_no">Отмена</button></div></aside>';
  $("bgd").onclick=$("n_no").onclick=function(){$("layer").innerHTML=""};
  $("n_ok").onclick=function(){var n=$("n_name").value.trim();if(!n)return;
    var o={kind:"order",priority:"",id:"o"+Date.now(),name:n,status:ST.order[0][0],owner:"",notes:"",next:"",nextdate:"",summary:$("n_sum").value,contact:$("n_cl").value,city:$("n_ex").value?"исполнитель: "+$("n_ex").value:"",qty:$("n_qty").value,money:$("n_money").value};
    S.orders.unshift(o);save();addLog(o,"Создано","Заказ создан");$("layer").innerHTML="";render()};
}

function renderLog(){
  var h='<div class="row"><button class="btn" id="csv">Скачать журнал (CSV)</button></div>';
  if(!S.log.length)h+='<div class="empty">Журнал пуст. Здесь появятся все отметки: письма, ответы, смена статусов.</div>';
  else h+='<table><thead><tr><th>Когда</th><th>Кто</th><th>Запись</th><th>Что</th></tr></thead><tbody>'+S.log.slice(0,500).map(function(x){return'<tr class="r" data-id="'+esc(x.id)+'"><td>'+fmt(x.t)+'</td><td>'+esc(x.who)+'</td><td><b>'+esc(x.name)+'</b></td><td><b>'+esc(x.type)+'</b>'+(x.text?'<small>'+esc(x.text)+'</small>':"")+'</td></tr>'}).join("")+'</tbody></table>';
  $("main").innerHTML=h;
  [].forEach.call(document.querySelectorAll("tr.r"),function(r){r.onclick=function(){if(findIt(r.dataset.id))openIt(r.dataset.id)}});
  $("csv").onclick=function(){var rows=[["Дата","Кто","Запись","Тип","Текст"]].concat(S.log.map(function(x){return[new Date(x.t).toISOString().slice(0,16).replace("T"," "),x.who,x.name,x.type,x.text]}));
    dl("zhurnal.csv","\ufeff"+rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(";")}).join("\r\n"),"text/csv")};
}
function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"}));a.download=name;a.click()}
function renderSet(){
  $("main").innerHTML='<div class="note">Имя и почта подставляются в подпись писем. Хранятся только в этом браузере.</div><div class="fl" style="max-width:520px"><label class="f">Имя в подписи<input id="s_name" value="'+esc(S.me.name)+'"></label><label class="f">Почта в подписи<input id="s_mail" value="'+esc(S.me.email)+'"></label><label class="f">Телефон (необязательно)<input id="s_tel" value="'+esc(S.me.phone)+'"></label></div>'+
  '<h3>Резервная копия</h3><div class="row"><button class="btn" id="exp">Скачать копию (JSON)</button><label class="btn">Загрузить копию<input type="file" id="imp" accept=".json" style="display:none"></label></div><p style="color:#6b7280;font-size:14px">Копия нужна, чтобы перенести отметки на другой компьютер или отправить второму. Загрузка заменяет то, что сейчас в этом браузере.</p>';
  ["name","mail","tel"].forEach(function(k){$("s_"+k).onchange=function(){S.me={name:$("s_name").value,email:$("s_mail").value,phone:$("s_tel").value};save();toast("Сохранено")}});
  $("exp").onclick=function(){dl("avuniplast-base-"+today()+".json",JSON.stringify(S),"application/json")};
  $("imp").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.st||!d.log)throw 0;if(confirm("Заменить текущие отметки загруженными?")){S=d;save();toast("Загружено");render()}}catch(e){toast("Это не файл копии")}};r.readAsText(f)};
}
render();
</script>
</body>
</html>
